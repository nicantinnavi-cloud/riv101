<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2f3a">
<meta name="description" content="Riv101 : jeu éducatif de canot d’eau vive pour les 10 à 12 ans. Coups d’aviron, lecture de rapides et sécurité en rivière.">
<title>Riv101</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400..800&display=swap">
<style>
:root {
  color-scheme: dark;
  --deep: #0b2f3a; --river: #1f7a86; --foam: #eefaf7; --spruce: #2c5a3c; --canot: #d4432f; --vfi: #ffb629;
  --ink: #06202a; --panel: rgba(9,42,53,.9); --line: rgba(238,250,247,.16); --mute: rgba(238,250,247,.72);
  --ok: #3fbf7f;
  --gl: max(16px, env(safe-area-inset-left, 0px)); --gr: max(16px, env(safe-area-inset-right, 0px));
  --title: 'Lilita One', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
  --text: 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--deep); color: var(--foam); font: 400 16px/1.5 var(--text);
  overflow: hidden; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
}
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
h1, h2, h3 { font-family: var(--title); font-weight: 400; line-height: 1.1; margin: 0; text-wrap: balance; letter-spacing: .01em; }
p { margin: 0 0 .7em; }
b { font-weight: 800; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--vfi); outline-offset: 3px; }
body.pad :focus { outline: 4px solid var(--vfi); outline-offset: 3px; box-shadow: 0 0 0 8px rgba(255,182,41,.25); }
.mute { color: var(--mute); }
.small { font-size: 14px; }
kbd {
  display: inline-block; min-width: 28px; padding: 1px 7px; border-radius: 6px; text-align: center;
  background: rgba(238,250,247,.1); border: 1px solid var(--line); border-bottom-width: 3px; font: 800 13px/1.6 var(--text);
}

/* Boutons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 22px;
  border: 0; border-radius: 10px; background: var(--vfi); color: var(--ink); cursor: pointer;
  font: 400 19px/1 var(--title); letter-spacing: .02em; box-shadow: 0 3px 0 #b9790d; transition: transform .1s, filter .15s;
}
.btn:hover { filter: brightness(1.07); }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #b9790d; }
.btn.ghost { background: rgba(238,250,247,.06); color: var(--foam); box-shadow: inset 0 0 0 2px var(--line); }
.btn.sm { min-height: 44px; padding: 8px 14px; font-size: 16px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }

/* Écrans */
#screen { position: fixed; inset: 0; z-index: 5; overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
#screen.home { background: linear-gradient(90deg, rgba(6,32,42,.96) 0, rgba(6,32,42,.9) 470px, rgba(6,32,42,.35) 640px, rgba(6,32,42,0) 820px); }
#screen.sub { background: linear-gradient(rgba(6,32,42,.6), rgba(6,32,42,.85)); }
.kicker { margin: 0 0 6px; font: 800 13px/1.2 var(--text); letter-spacing: .14em; text-transform: uppercase; color: var(--vfi); }
.lead { color: var(--mute); font-size: 17px; max-width: 60ch; }

.home-col { max-width: 560px; padding: clamp(28px, 7vh, 64px) var(--gr) 48px max(var(--gl), 40px); }
.logo { font-size: clamp(60px, 10vw, 96px); line-height: .95; margin-bottom: 14px; text-shadow: 0 4px 0 rgba(0,0,0,.25); }
.logo span { color: var(--vfi); }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 26px 0 30px; }
.tile {
  display: flex; flex-direction: column; gap: 5px; text-align: left; padding: 14px 14px 12px; min-height: 148px; cursor: pointer;
  background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--c); border-radius: 3px 3px 14px 14px;
  transition: transform .15s, background .15s;
}
.tile:hover { transform: translateY(-2px); background: rgba(14,60,74,.95); }
.tile svg { width: 32px; height: 30px; fill: none; stroke: var(--c); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.tile-n { font: 400 21px/1.1 var(--title); }
.tile-d { color: var(--mute); font-size: 14px; line-height: 1.35; }
.tile-p { margin-top: auto; font-weight: 800; font-size: 13px; }
.meter { display: block; height: 6px; border-radius: 3px; background: rgba(238,250,247,.12); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--c, var(--vfi)); border-radius: 3px; }
.badges h2 { font-size: 22px; margin-bottom: 10px; }
.badges ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(156px, 1fr)); gap: 8px; }
.badge { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: rgba(238,250,247,.04); border: 1px dashed var(--line); }
.badge svg { flex: none; width: 36px; height: 36px; fill: rgba(238,250,247,.06); stroke: rgba(238,250,247,.3); stroke-width: 2; }
.badge .w { fill: none; }
.badge.on { border-style: solid; border-color: var(--c); background: rgba(9,42,53,.9); }
.badge.on svg { fill: var(--c); stroke: var(--c); }
.badge.on .w { stroke: var(--ink); stroke-width: 2.6; }
.badge b { display: block; font-size: 14px; line-height: 1.2; }
.badge small { color: var(--mute); font-size: 12px; }
.opts { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 24px; }
.opts label { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; cursor: pointer; font-weight: 700; }
.opts input { width: 22px; height: 22px; accent-color: var(--vfi); }
@media (max-width: 879px) {
  #screen.home { background: linear-gradient(180deg, rgba(6,32,42,0) 0, rgba(6,32,42,0) 28vh, rgba(6,32,42,.92) 40vh, rgba(6,32,42,.97) 100%); }
  .home-col { padding-top: 36vh; padding-left: var(--gl); margin: 0 auto; }
}
@media (max-width: 359px) { .tiles { grid-template-columns: 1fr; } }

.wrap { padding: max(20px, env(safe-area-inset-top, 0px)) var(--gr) 48px var(--gl); }
.panel {
  max-width: 760px; margin: 0 auto; padding: 22px clamp(16px, 4vw, 32px) 26px; border-radius: 16px;
  background: var(--panel); border: 1px solid var(--line);
  box-shadow: inset 0 1px 0 rgba(238,250,247,.08), 0 20px 50px rgba(0,0,0,.35);
  -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
}
.ph { margin-bottom: 16px; }
.ph h1 { font-size: clamp(30px, 6vw, 42px); }
.panel h2 { font-size: 22px; margin: 22px 0 10px; }
.back {
  display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 4px 12px 4px 4px; margin: -6px 0 8px -4px;
  background: none; border: 0; border-radius: 8px; cursor: pointer; color: var(--mute); font-weight: 800;
}
.back svg { width: 24px; height: 24px; }
.back:hover { color: var(--foam); }
.note { padding: 10px 14px; border-left: 4px solid var(--vfi); background: rgba(255,182,41,.08); border-radius: 0 8px 8px 0; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; margin-top: 16px; }
.card {
  display: flex; flex-direction: column; align-items: flex-start; gap: 6px; text-align: left; padding: 14px 16px; min-height: 112px;
  background: rgba(238,250,247,.05); border: 1px solid var(--line); border-left: 4px solid var(--river); border-radius: 4px 12px 12px 4px; cursor: pointer;
}
.card:hover:not([disabled]) { background: rgba(238,250,247,.1); border-left-color: var(--vfi); }
.card.locked { opacity: .55; cursor: not-allowed; }
.cls, .chip { font: 800 12px/1 var(--text); letter-spacing: .08em; text-transform: uppercase; padding: 5px 8px; border-radius: 5px; background: rgba(31,122,134,.45); }
.chip.done { background: var(--ok); color: var(--ink); }
.cn { font: 400 20px/1.15 var(--title); }
.cd { color: var(--mute); font-size: 14px; line-height: 1.35; }
.lock { display: inline-flex; align-items: center; gap: 6px; margin-top: auto; color: var(--mute); font-weight: 700; font-size: 14px; }
.lock svg { width: 18px; height: 18px; fill: currentColor; }
.stars { display: inline-flex; gap: 2px; margin-top: auto; }
.stars svg { width: 22px; height: 22px; fill: rgba(238,250,247,.18); }
.stars i { display: inline-flex; }
.stars i.on svg { fill: var(--vfi); }
.stars.big svg { width: 58px; height: 58px; }
.nivs { display: grid; gap: 2px; margin-top: auto; }
.niv-r { display: flex; align-items: center; gap: 6px; }
.niv-n { width: 52px; font-size: 12px; font-weight: 800; color: var(--mute); }
.niv-r .stars { margin-top: 0; }
.niv-r .stars svg { width: 17px; height: 17px; }
.lock.sm { margin-top: 0; font-size: 12px; }
.lock.sm svg { width: 14px; height: 14px; }
.nivpick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.nivb {
  display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px; min-height: 44px; cursor: pointer; text-align: center;
  background: rgba(238,250,247,.05); border: 2px solid var(--line); border-radius: 12px;
}
.nivb[aria-checked="true"] { border-color: var(--vfi); background: rgba(255,182,41,.12); }
.nivb[disabled] { opacity: .55; cursor: not-allowed; }
.nivb-n { font-weight: 800; font-size: 15px; line-height: 1.2; }
.nivb-c { font: 800 11px/1 var(--text); letter-spacing: .08em; padding: 4px 6px; border-radius: 5px; background: rgba(31,122,134,.45); }
.nivb .stars { margin-top: 0; }
.nivb .stars svg { width: 16px; height: 16px; }
.gauge { width: 44px; height: 50px; }
.gauge .g-w { fill: #2a8fa0; }
.gauge .g-wl { fill: none; stroke: #bfeef0; stroke-width: 1.5; }
.gauge .g-r { fill: #f4e3b5; stroke: #6b4a22; stroke-width: 1; }
.gauge .g-t { stroke: #6b4a22; stroke-width: 1.4; }
.nivtxt { margin-top: 10px; padding: 10px 14px; border-left: 4px solid #4aa3df; background: rgba(74,163,223,.1); border-radius: 0 8px 8px 0; }
.res-stars { text-align: center; margin: 4px 0 14px; }

.intro { font-size: 17px; max-width: 62ch; }
.words { margin: 0; display: grid; gap: 8px; }
.words div { padding: 10px 14px; background: rgba(238,250,247,.05); border-radius: 8px; }
.words dt { font-weight: 800; color: var(--vfi); }
.words dd { margin: 2px 0 0; color: var(--mute); }
.keys { list-style: none; padding: 0; margin: 0 0 10px; display: flex; flex-wrap: wrap; gap: 8px 18px; }
.keys li { display: flex; align-items: center; gap: 6px; }
.steps { padding-left: 22px; }
.steps li { margin-bottom: 8px; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin: 0 0 16px; }
.stats div { padding: 10px 12px; border-radius: 8px; background: rgba(238,250,247,.05); }
.stats dt { color: var(--mute); font-size: 13px; font-weight: 700; }
.stats dd { margin: 0; font: 400 24px/1.2 var(--title); }
.learned { padding: 12px 14px; border-radius: 8px; background: rgba(63,191,127,.12); border-left: 4px solid var(--ok); }
.tip { color: var(--mute); }

.picks { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 4px; }
.pick {
  min-height: 48px; padding: 8px 16px; border-radius: 999px; cursor: pointer; font-weight: 700;
  background: rgba(238,250,247,.05); border: 2px solid var(--line);
}
.pick[aria-pressed="true"] { background: var(--vfi); color: var(--ink); border-color: var(--vfi); }
.fb { margin-top: 16px; }
.fb:empty { display: none; }
.verdict { font: 400 22px/1.2 var(--title); }
.verdict.ok { color: #7fe0a8; }
.verdict.ko { color: #ff9b8a; }
.errs { padding-left: 20px; }
.errs li { margin-bottom: 6px; }

.prog { margin: 0 0 6px; font-weight: 800; color: var(--mute); font-size: 14px; }
.q { font-size: 20px; font-weight: 800; margin: 18px 0 14px; }
.figbox { display: grid; place-items: center; margin-top: 14px; padding: 10px; border-radius: 12px; background: linear-gradient(#2c5a3c, #23474a); }
.fig { width: 140px; height: 175px; }
.answers { display: grid; gap: 8px; }
.ans {
  min-height: 52px; padding: 10px 16px; text-align: left; cursor: pointer; font-weight: 700; font-size: 17px;
  background: rgba(238,250,247,.05); border: 2px solid var(--line); border-radius: 10px;
}
.ans:hover:not([disabled]) { border-color: var(--vfi); }
.ans[disabled] { cursor: default; }
.ans.right { background: rgba(63,191,127,.22); border-color: var(--ok); }
.ans.wrong { background: rgba(212,67,47,.22); border-color: var(--canot); }
.score { font: 400 30px/1.1 var(--title); }
.score b { font-size: 64px; color: var(--vfi); font-weight: 400; }

.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 16px; }
.tabs button {
  min-height: 44px; padding: 8px 16px; border-radius: 999px; cursor: pointer; font-weight: 800;
  background: transparent; border: 2px solid var(--line);
}
.tabs button[aria-selected="true"] { background: var(--foam); color: var(--ink); border-color: var(--foam); }
.terms { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.term { padding: 12px; border-radius: 12px; background: rgba(238,250,247,.05); border: 1px solid var(--line); }
.term h3 { font-size: 20px; margin: 4px 0 6px; }
.term p { color: var(--mute); margin: 0; font-size: 15px; }
canvas.scene { display: block; width: 100%; aspect-ratio: 4 / 3; border-radius: 8px; background: var(--spruce); margin-bottom: 8px; }

/* Tête haute */
#hud { position: fixed; inset: 0; z-index: 3; pointer-events: none; }
.hud-card {
  position: absolute; top: max(10px, env(safe-area-inset-top, 0px)); left: var(--gl); right: calc(var(--gr) + 60px); max-width: 540px;
  padding: 7px 12px 8px; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--vfi); border-radius: 4px 12px 12px 4px;
}
.hud-name { margin: 0; font: 800 12px/1.2 var(--text); letter-spacing: .08em; text-transform: uppercase; color: var(--mute); }
.hud-task { margin: 2px 0 0; font-weight: 700; font-size: 15px; line-height: 1.3; }
.hud-strokes { margin: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; min-height: 22px; }
.hud-strokes span { font: 800 12px/1.25 var(--text); text-align: center; padding: 5px 9px; border-radius: 999px; background: var(--vfi); color: var(--ink); }
.hud-pause {
  position: absolute; top: max(10px, env(safe-area-inset-top, 0px)); right: var(--gr); width: 48px; height: 48px; pointer-events: auto; cursor: pointer;
  display: grid; place-items: center; border-radius: 12px; background: var(--panel); border: 1px solid var(--line);
}
.hud-pause svg { width: 22px; height: 22px; fill: var(--foam); }
.hud-bottom {
  position: absolute; left: 50%; transform: translateX(-50%); bottom: max(14px, env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; align-items: center; gap: 6px; width: max-content; max-width: calc(100% - 32px);
}
.hud-row { display: flex; align-items: center; gap: 10px; }
body.touch .hud-bottom { bottom: calc(max(10px, env(safe-area-inset-bottom, 0px)) + 124px); }
.bal { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); }
.bal-mid { display: flex; flex-direction: column; gap: 3px; }
.bal-t { font: 800 11px/1 var(--text); letter-spacing: .1em; text-transform: uppercase; color: var(--mute); text-align: center; }
.bal-track { display: block; width: min(200px, 36vw); height: 10px; border-radius: 5px; background: rgba(238,250,247,.14); overflow: hidden; }
#balFill { display: block; width: 0; height: 100%; background: var(--ok); transition: width .1s; }
#balFill.hot { background: var(--canot); }
.wat { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
.wat .bal-t { width: 30px; text-align: left; }
.wat-track { width: calc(min(200px, 36vw) - 36px); height: 8px; }
#watFill { display: block; width: 0; height: 100%; background: #5fb4e8; transition: width .2s; }
#watFill.warm { background: var(--vfi); }
#watFill.hot { background: var(--canot); }
#hud:not([data-wet="1"]) .wat { display: none; }
.bail-btn {
  pointer-events: auto; cursor: pointer; touch-action: none; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  min-width: 64px; min-height: 52px; padding: 4px 10px; border-radius: 14px; background: #1f6f9c; border: 2px solid #5fb4e8; font: 800 14px/1 var(--text); color: var(--foam);
}
.bail-btn kbd { min-width: 0; padding: 0 5px; font-size: 11px; line-height: 1.4; }
body.touch .bail-btn kbd, body.pad .bail-btn kbd { display: none; }
.bail-btn.on { background: #5fb4e8; color: var(--ink); }
#hud[data-mode="swim"] .bail-btn { display: none; }
.bal-m { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; border: 2px solid var(--line); font: 800 14px/1 var(--text); color: var(--mute); }
.bal-m.need { border-color: var(--vfi); color: var(--vfi); animation: pulse .5s infinite alternate; }
.bal-m.on { background: var(--vfi); border-color: var(--vfi); color: var(--ink); }
@keyframes pulse { to { box-shadow: 0 0 0 6px rgba(255,182,41,.3); } }
#hud[data-mode="swim"] .bal, #hud[data-mode="rope"] .bal { display: none; }
#hud:not([data-mode="swim"]) .hearts { display: none; }
.hearts { display: flex; gap: 4px; padding: 6px 10px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); }
.hearts svg { width: 26px; height: 24px; fill: var(--canot); }
.hearts svg.off { fill: rgba(238,250,247,.18); }

/* Manette tactile */
#pad {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; display: flex; flex-direction: column; gap: 6px;
  padding: 8px var(--gr) max(10px, env(safe-area-inset-bottom, 0px)) var(--gl);
  touch-action: none; user-select: none; -webkit-user-select: none;
}
.pg { display: flex; gap: 6px; max-width: 640px; width: 100%; margin: 0 auto; }
#pad button {
  flex: 1; min-width: 44px; height: 50px; border-radius: 14px; cursor: pointer; touch-action: none;
  background: rgba(6,32,42,.75); border: 2px solid rgba(238,250,247,.3); font: 800 13px/1.1 var(--text);
}
#pad button.on { background: var(--vfi); border-color: var(--vfi); color: var(--ink); }
#pad .s, #pad .s-only { display: none; }
#pad[data-mode="swim"] .c, #pad[data-mode="swim"] .c-only { display: none; }
#pad[data-mode="swim"] .s { display: inline; }
#pad[data-mode="swim"] .s-only { display: block; }

/* Barre de repérage */
#scoutbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; padding: 0 var(--gr) max(12px, env(safe-area-inset-bottom, 0px)) var(--gl); pointer-events: none; }
.sb-in {
  pointer-events: auto; max-width: 760px; margin: 0 auto; padding: 12px 16px;
  background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--vfi); border-radius: 4px 4px 14px 14px;
}
.sb-n { margin: 0; font: 800 12px/1.2 var(--text); letter-spacing: .08em; text-transform: uppercase; color: var(--vfi); }
.sb-q { margin: 4px 0 10px; font-weight: 800; font-size: 17px; line-height: 1.35; }
.sb-b { display: flex; flex-wrap: wrap; gap: 8px; }
.sb-h { margin: 8px 0 0; font-size: 13px; color: var(--mute); }

/* Réticule de manette */
#cross {
  position: fixed; left: 0; top: 0; z-index: 4; width: 44px; height: 44px; margin: -22px 0 0 -22px; pointer-events: none;
  border: 3px solid var(--vfi); border-radius: 50%; box-shadow: 0 0 0 2px rgba(6,32,42,.7), inset 0 0 0 2px rgba(6,32,42,.7);
}
#cross::before, #cross::after { content: ''; position: absolute; left: 50%; top: 50%; background: var(--vfi); transform: translate(-50%, -50%); }
#cross::before { width: 4px; height: 4px; border-radius: 50%; }

/* Toast et dialogue */
#toast {
  position: fixed; z-index: 8; left: 50%; top: calc(max(10px, env(safe-area-inset-top, 0px)) + 128px); transform: translateX(-50%);
  width: max-content; max-width: min(520px, calc(100% - 32px)); padding: 10px 16px; border-radius: 10px;
  background: rgba(6,32,42,.94); border-left: 4px solid var(--vfi); font-weight: 700; box-shadow: 0 10px 30px rgba(0,0,0,.35);
}
#toast.show { animation: toastIn .25s ease-out; }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, -8px); } }
body[data-view="scout"] #toast, body[data-view="menu"] #toast { top: max(16px, env(safe-area-inset-top, 0px)); }

<script>

// ---- src/core.js
'use strict';
// Riv101 : utilitaires, sauvegarde locale et sons.
const R = window.R = {};
R.clamp = (v, a, b) => v < a ? a : v > b ? b : v;
R.lerp = (a, b, t) => a + (b - a) * t;
// Fonctionne aussi avec a > b (rampe descendante).
R.sstep = (a, b, x) => { const t = R.clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
R.hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
R.$ = (s, el) => (el || document).querySelector(s);
R.$$ = (s, el) => Array.from((el || document).querySelectorAll(s));
R.shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; };

R.save = {
  d: { stars: {}, done: {}, opts: { sound: 'normal', unlock: false } },
  load() {
    try {
      const s = JSON.parse(localStorage.getItem('riv101') || 'null');
      if (s) { Object.assign(this.d.stars, s.stars); Object.assign(this.d.done, s.done); Object.assign(this.d.opts, s.opts); }
      // Ancienne sauvegarde : sound était vrai ou faux.
      const m = this.d.opts.sound;
      if (m === false) this.d.opts.sound = 'coupe'; else if (!R.SOUND[m]) this.d.opts.sound = 'normal';
    } catch (e) { /* stockage indisponible : on joue sans sauvegarde */ }
  },
  store() { try { localStorage.setItem('riv101', JSON.stringify(this.d)); } catch (e) { /* idem */ } },
  star(id, n) { if ((this.d.stars[id] || 0) < n) { this.d.stars[id] = n; this.store(); } },
  mark(id) { if (!this.d.done[id]) { this.d.done[id] = 1; this.store(); } }
};
// Étoiles par niveau d'eau : « id » en eau moyenne (comme avant), « id@bas » et « id@haut ».
R.starKey = (id, niv) => niv && niv !== 'moyen' ? id + '@' + niv : id;

// Réglages du son : gain général, effets, bruit de la rivière.
R.SOUND = { normal: { m: 1, fx: 1, riv: 1, t: 'Son : normal' }, doux: { m: 1, fx: 0.7, riv: 0.5, t: 'Son : doux' }, coupe: { m: 0, fx: 1, riv: 1, t: 'Son : coupé' } };
R.audio = {
  ctx: null, rv: 0,
  mode() { return R.SOUND[R.save.d.opts.sound] ? R.save.d.opts.sound : 'normal'; },
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      const c = this.ctx = new AC();
      const len = c.sampleRate * 2, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
      let last = 0;
      for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; last = (last + 0.04 * w) / 1.04; d[i] = last * 4 + w * 0.15; }
      this.noise = buf;
      const S = R.SOUND[this.mode()];
      this.master = c.createGain(); this.master.gain.value = S.m; this.master.connect(c.destination);
      this.fx = c.createGain(); this.fx.gain.value = S.fx; this.fx.connect(this.master);
      const src = c.createBufferSource(); src.buffer = buf; src.loop = true;
      // Bruit de fond de la rivière : discret et sourd (un grondement plutôt qu'un souffle), sous les effets.
      this.lp = c.createBiquadFilter(); this.lp.type = 'lowpass'; this.lp.frequency.value = 350;
      this.river = c.createGain(); this.river.gain.value = 0.012 * S.riv;
      src.connect(this.lp); this.lp.connect(this.river); this.river.connect(this.master); src.start();
    } catch (e) { this.ctx = null; }
  },
  setMode(m) {
    if (!R.SOUND[m]) m = 'normal';
    R.save.d.opts.sound = m; R.save.store();
    if (!this.ctx) return;
    const S = R.SOUND[m]; this.master.gain.value = S.m; this.fx.gain.value = S.fx; this.setRiver(this.rv, true);
  },
  nextMode() { const k = Object.keys(R.SOUND), m = k[(k.indexOf(this.mode()) + 1) % k.length]; this.setMode(m); return m; },
  riverGain(v) { return (0.012 + 0.10 * v) * R.SOUND[this.mode()].riv; },
  setRiver(v, now) {
    this.rv = v; if (!this.ctx) return; const t = this.ctx.currentTime, g = this.riverGain(v);
    if (now) { this.river.gain.cancelScheduledValues(t); this.river.gain.value = g; } else this.river.gain.setTargetAtTime(g, t, 0.3);
    this.lp.frequency.setTargetAtTime(300 + 900 * v, t, 0.3);
  },
  tone(f, dur, type, vol, f2) {
    const c = this.ctx; if (!c) return; const o = c.createOscillator(), g = c.createGain(), t = c.currentTime;
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol || 0.2, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.fx); o.start(t); o.stop(t + dur + 0.02);
  },
  burst(dur, freq, vol) {
    const c = this.ctx; if (!c) return; const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(), t = c.currentTime;
    s.buffer = this.noise; f.type = 'bandpass'; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.fx); s.start(t, Math.random()); s.stop(t + dur + 0.02);
  },
  sfx(n) {
    if (!this.ctx) return; const T = this;
    if (n === 'paddle') T.burst(0.22, 1400, 0.22);
    else if (n === 'bump') T.tone(110, 0.18, 'sine', 0.35, 60);
    else if (n === 'hit') { T.tone(90, 0.3, 'triangle', 0.5, 45); T.burst(0.2, 500, 0.3); }
    else if (n === 'ding') { T.tone(660, 0.14, 'sine', 0.22); setTimeout(() => T.tone(990, 0.25, 'sine', 0.22), 110); }
    else if (n === 'no') T.tone(220, 0.25, 'square', 0.07, 150);
    else if (n === 'win') [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => T.tone(f, 0.3, 'triangle', 0.22), i * 130));
    else if (n === 'fail') T.tone(330, 0.6, 'sawtooth', 0.1, 80);
    else if (n === 'splash') T.burst(0.6, 800, 0.5);
    else if (n === 'whoosh') T.burst(0.35, 2400, 0.2);
    else if (n === 'scrape') { T.burst(0.28, 3200, 0.12); T.tone(70, 0.22, 'sawtooth', 0.05, 55); }
    else if (n === 'bail') T.burst(0.3, 1100, 0.16);
  }
};

// ---- src/river.js
(function () {
'use strict';
// Construit une rivière à partir d'une définition de niveau.
// Repère : x vers la rive droite, y vers l'aval (en mètres). Les décalages « o » des
// niveaux sont mesurés depuis le centre de la rivière ('L' / 'R' = collé à une rive).
// Niveaux d'eau : v = courant, d = décalage de profondeur (m), w = largeur, rk = rayon des roches,
// hk = force des rouleaux, wk = force des vagues, ek = contre-courants, sl = longueur des passoires,
// tip = instabilité, wet = eau embarquée.
R.NIVEAUX = {
  bas: { v: 0.75, d: -0.45, w: 1, rk: 1.15, hk: 0.6, wk: 0.65, ek: 1, sl: 1, tip: 0.85, wet: 0.6 },
  moyen: { v: 1, d: 0, w: 1, rk: 1, hk: 1, wk: 1, ek: 1, sl: 1, tip: 1, wet: 1 },
  haut: { v: 1.35, d: 0.6, w: 1.08, rk: 1, hk: 1.35, wk: 1.45, ek: 0.7, sl: 1.3, tip: 1.2, wet: 1.6 }
};
// Classe affichée : un cran de plus en eau haute.
R.clsFor = function (def, niv) {
  if (niv !== 'haut') return def.cls;
  return { R1: 'R2', R2: 'R2+', 'R2+': 'R3', R3: 'R3+' }[def.cls] || def.cls;
};
R.buildRiver = function (def, niveau) {
  const niv = R.NIVEAUX[niveau] ? niveau : 'moyen', NV = R.NIVEAUX[niv];
  const L = def.len, n = L + 1, P = def.path;
  const cx = new Float32Array(n), hw = new Float32Array(n), vb = new Float32Array(n), dcx = new Float32Array(n), skew = new Float32Array(n);
  let k = 0;
  for (let i = 0; i < n; i++) {
    while (k < P.length - 2 && i >= P[k + 1][0]) k++;
    const a = P[k], b = P[k + 1], t = R.sstep(a[0], b[0], i);
    cx[i] = R.lerp(a[1], b[1], t); hw[i] = R.lerp(a[2], b[2], t) * NV.w; vb[i] = R.lerp(a[3], b[3], t) * NV.v;
  }
  for (let i = 0; i < n; i++) dcx[i] = (cx[Math.min(n - 1, i + 1)] - cx[Math.max(0, i - 1)]) / 2;
  // Dans un virage, la veine se déporte vers l'extérieur (drossage).
  const raw = new Float32Array(n);
  for (let i = 1; i < n - 1; i++) raw[i] = R.clamp(-(dcx[i + 1] - dcx[i - 1]) / 2 * 12, -0.45, 0.45);
  for (let i = 0; i < n; i++) { let s = 0, c = 0; for (let j = Math.max(0, i - 6); j <= Math.min(n - 1, i + 6); j++) { s += raw[j]; c++; } skew[i] = s / c; }

  const D0 = def.depth || 1.2, CU = niv === 'haut' ? 1.35 : 1; // coussins plus marqués en eau haute
  const rv = { def, L, niveau: niv, nv: NV, D0, rocks: [], holes: [], waves: [], strainers: [], vs: [], bars: [], seuil: null, portage: null };
  rv.at = function (y, o) {
    const f = R.clamp(y, 0, L - 0.001), i = f | 0, t = f - i;
    o.cx = cx[i] + (cx[i + 1] - cx[i]) * t; o.hw = hw[i] + (hw[i + 1] - hw[i]) * t; o.vb = vb[i] + (vb[i + 1] - vb[i]) * t;
    o.dcx = dcx[i] + (dcx[i + 1] - dcx[i]) * t; o.skew = skew[i] + (skew[i + 1] - skew[i]) * t; return o;
  };
  const T = {};
  rv.cxAt = y => rv.at(y, T).cx;
  rv.hwAt = y => rv.at(y, T).hw;
  const X = (o, y, r) => o === 'L' ? rv.cxAt(y) - rv.hwAt(y) + (r || 0) * 0.35 : o === 'R' ? rv.cxAt(y) + rv.hwAt(y) - (r || 0) * 0.35 : rv.cxAt(y) + o;

  // Eau haute : les petites roches de plein courant passent sous l'eau et deviennent des rouleaux.
  // Les grosses gardent un contre-courant plus court et plus faible.
  (def.rocks || []).forEach((q, i) => {
    const bank = typeof q[0] === 'string', r = bank ? q[2] : q[2] * NV.rk;
    if (niv === 'haut' && !bank && q[2] < 2.2) { rv.holes.push({ x: X(q[0], q[1]), y: q[1] + 0.4 * r, w: 2 * r + 1.4, len: 2.6, k: 0.55, sub: true }); return; }
    const ek = bank ? 1 : NV.ek;
    rv.rocks.push({ x: X(q[0], q[1], r), y: q[1], r, Le: (5 * r + 2) * ek, w: 1.3 * r, ek: niv === 'haut' && !bank ? 0.75 : 1, bank, id: i });
  });
  (def.holes || []).forEach(q => rv.holes.push({ x: X(q[0], q[1]), y: q[1], w: q[2] * (niv === 'haut' ? 1.15 : 1), len: 3.5, k: NV.hk }));
  (def.waves || []).forEach(q => rv.waves.push({ x: X(q[0], q[1]), y: q[1], w: q[2], len: q[3] * (niv === 'haut' ? 1.15 : niv === 'bas' ? 0.85 : 1), k: NV.wk }));
  (def.strainers || []).forEach(q => { const x0 = X(q[0], q[1]), s = q[0] === 'L' ? 1 : -1, l = q[2] * NV.sl; rv.strainers.push({ x0, y0: q[1], x1: x0 + s * l, y1: q[1] + l * 0.35 }); });
  // Bancs de gravier et hauts-fonds : ellipses qui retranchent jusqu'à h mètres.
  (def.bars || []).forEach(q => { const rx = q[2]; rv.bars.push({ x: typeof q[0] === 'string' ? X(q[0], q[1], rx * 1.4) : X(q[0], q[1]), y: q[1], rx, ry: q[3], h: q[4] == null ? 1 : q[4] }); });
  (def.vs || []).forEach(q => rv.vs.push({ x: X(q[0], q[1]), y: q[1] }));
  if (def.seuil) rv.seuil = { y: def.seuil.y, safe: !!def.seuil.safe };
  if (def.portage) rv.portage = def.portage;
  // Types de berge : 'cliff' (falaise, on ne sort pas) sur les tronçons listés, berge basse ailleurs.
  rv.banks = (def.banks || []).map(q => ({ side: q[0], y0: q[1], y1: q[2], type: q[3] || 'cliff' }));
  rv.bankType = function (side, y) {
    for (let i = 0; i < rv.banks.length; i++) { const k = rv.banks[i]; if (k.side === side && y >= k.y0 && y <= k.y1) return k.type; }
    return 'low';
  };

  // Profondeur (m) sans les roches : profil en travers, plus creux à l'extérieur des virages,
  // moins des bancs, plus le décalage du niveau d'eau. Négatif = gravier à sec.
  function baseDepth(x, y, p, q, sk) {
    const side = sk > 0 ? p : -p, out = side > 0 ? side * Math.abs(sk) * 1.3 : 0;
    let d = D0 * (0.12 + 0.88 * Math.pow(Math.max(0, 1 - q * q), 0.6)) * (1 + out) + NV.d;
    for (let i = 0; i < rv.bars.length; i++) {
      const b = rv.bars[i], ey = (y - b.y) / b.ry; if (ey > 1 || ey < -1) continue;
      const ex = (x - b.x) / b.rx; if (ex > 1 || ex < -1) continue;
      const e = Math.sqrt(ex * ex + ey * ey); if (e < 1) d -= b.h * R.sstep(1, 0.55, e);
    }
    return d;
  }
  // Halo moins profond autour d'une roche (pas pour les pointes de berge).
  // Derrière la roche, le contre-courant creuse une fosse un peu plus profonde (valeur négative = plus creux).
  const halo = (k, dx, dy) => {
    let v = 0;
    if (dy > 0 && dy < k.Le) { const t = dy / k.Le, a = Math.abs(dx) / (k.w + 1); if (a < 1) v -= 0.3 * R.sstep(1, 0.5, a) * R.sstep(1, 0.5, t) * R.sstep(0, k.r, dy); }
    if (k.bank) return v;
    const d = Math.hypot(dx, dy); return v + (d < k.r + 1.8 ? 0.35 * R.sstep(k.r + 1.8, k.r, d) : 0);
  };

  // Vitesse de l'eau au point (x, y). out.d reçoit la profondeur.
  const A = {};
  rv.flow = function (x, y, out) {
    rv.at(y, A);
    const p = (x - A.cx) / A.hw;
    if (p <= -1 || p >= 1) { out.x = 0; out.y = 0; out.land = true; out.d = -0.5; return out; }
    out.land = false;
    const sk = A.skew; let q = p - sk; q = q > 0 ? q / (1 - sk) : q / (1 + sk);
    let sp = A.vb * (0.12 + 0.88 * Math.pow(1 - q * q, 0.75)), dep = baseDepth(x, y, p, q, sk);
    const il = 1 / Math.hypot(A.dcx, 1);
    let mult = 1, ax = 0, ay = 0;
    for (let i = 0; i < rv.rocks.length; i++) {
      const k = rv.rocks[i], dy = y - k.y;
      if (dy < -3.5 * k.r || dy > k.Le) continue;
      const dx = x - k.x;
      dep -= halo(k, dx, dy);
      if (dy > -0.3 * k.r) { // contre-courant derrière la roche
        const t = dy / k.Le, w = k.w * (1 - t * t) + 0.2, a = Math.abs(dx) / w;
        // En eau haute, la ligne de cisaillement est plus brusque (transition plus étroite).
        if (a < 1.15) mult -= 1.35 * k.ek * (niv === 'haut' ? R.sstep(1.0, 0.85, a) : R.sstep(1.15, 0.55, a)) * R.sstep(1, 0.7, t) * R.sstep(-0.3 * k.r, 0.4 * k.r, dy);
      }
      if (dy < 0.5 * k.r) { // coussin : l'eau contourne la roche
        const d = Math.hypot(dx, dy), R2 = 3.4 * k.r;
        if (d < R2 && d > 0.01) { const kk = 1 - d / R2, s2 = sp * kk * kk * CU; ax += dx / d * s2 * 0.9; ay += dy / d * s2 * 0.55; }
      }
    }
    for (let i = 0; i < rv.holes.length; i++) {
      const h = rv.holes[i], dy = y - h.y;
      if (dy > -0.5 && dy < h.len) { const a = Math.abs(x - h.x) / (h.w / 2); if (a < 1) mult -= 1.5 * h.k * R.sstep(1, 0.8, a) * R.sstep(-0.5, 0.3, dy) * R.sstep(h.len, h.len - 0.8, dy); }
    }
    if (mult < -0.5) mult = -0.5;
    // Le courant ralentit sur un haut-fond.
    const sl = dep >= 0.5 ? 1 : 0.15 + 0.85 * R.sstep(-0.05, 0.5, dep);
    out.d = dep;
    out.x = (sp * A.dcx * il * mult + ax) * sl; out.y = (sp * il * mult + ay) * sl; return out;
  };
  // Profondeur seule (m). Hors de l'eau : -0.5.
  rv.depth = function (x, y) {
    rv.at(y, A);
    const p = (x - A.cx) / A.hw;
    if (p <= -1 || p >= 1) return -0.5;

function toCheckpoint() {
  if (def.swimOnly) { const s = stats; G.load(def, { noScout: true }); stats = s; return; }
  // Après un objectif manqué, l'eau reste dans le canot ; après un chavirage, on l'a vidé.
  const w = keepWater && boat && boat.mode === 'canoe' ? boat.water : 0; keepWater = false;
  boat = R.sim.newBoat(cp.x, cp.y, cp.th); hold = 0; portT = 0; clearInp(); boat.water = w;
  if (G.st !== 'demo') setSt('run');
  snapCam();
}

// ---------- Mise à jour (sans rendu) ----------
G.update = function (dt) {
  G.t += dt;
  if (!rv) return;
  for (let i = tlabels.length - 1; i >= 0; i--) if (tlabels[i].until < G.t) tlabels.splice(i, 1);
  if (G.paused) return;
  const st = G.st;
  if (st === 'demo' || st === 'run' || st === 'swim') {
    if (st !== 'demo') stats.time += dt;
    const h = dt / 2;
    for (let i = 0; i < 2; i++) {
      const b = boat, demo = G.st === 'demo';
      if (demo || G.headless) autoInput();
      if (b.mode === 'swim') R.sim.stepSwim(b, inp, rv, h);
      else { bail(b, h); R.sim.stepCanoe(b, inp, rv, h, demo || !!def.assist, demo ? 0 : (def.tippy || 1) * rv.nv.tip, demo ? 0 : wet); }
      events();
      if (G.st !== st || boat !== b) break;
      if (b.mode === 'canoe') { waterCheck(); doTasks(h); }
      if (G.st !== st || boat !== b) break;
    }
    if (!G.headless && boat) sounds(dt);
  } else if (st === 'rope') ropeUpdate(dt);
};

// Écoper : seulement à l'arrêt en eau calme. On ne pagaie pas pendant qu'on écope.
function calmHere(b) {
  rv.flow(b.x, b.y, U);
  return Math.hypot(b.vx, b.vy) < BAIL_SPEED && Math.hypot(U.x, U.y) < BAIL_CALM;
}
function bail(b, h) {
  b.bailing = false; bailNoT -= h;
  if (!inp.bail || !wet || b.water <= 0) return;
  if (!calmHere(b)) {
    if (bailNoT <= 0) { bailNoT = 2.5; say('Impossible d’écoper dans le courant : trouve de l’eau calme.'); sfx('no'); }
    return;
  }
  b.bailing = true; b.water = Math.max(0, b.water - h / BAIL_TIME);
}
G.canBail = () => !!(boat && boat.mode === 'canoe' && wet && boat.water > 0.01);

function autoInput() {
  const b = boat;
  if (b.mode === 'swim') { // vers la rive la plus proche, en position de sécurité
    b.active = false; const c = rv.cxAt(b.y);
    inp.left = b.x < c; inp.right = b.x >= c; inp.fwd = inp.back = inp.leanL = inp.leanR = false; return;
  }
  const k = tasks[ti]; let tx, ty;
  if (!k) { ty = b.y + 10; tx = rv.cxAt(ty); }
  else if (k.t === 'gate') { tx = k.x; ty = k.y + 3; }
  else if (k.t === 'finish') { ty = k.y + 6; tx = rv.cxAt(ty); }
  else { tx = k.x; ty = k.y; }
  if (ty - b.y > 22) {
    const y2 = b.y + 16, h2 = rv.hwAt(y2);
    tx = rv.cxAt(y2) + R.clamp((tx - rv.cxAt(ty)) * h2 / rv.hwAt(ty), -0.6 * h2, 0.6 * h2); ty = y2;
  }
  if (G.naive) { R.sim.naive(b, k && k.t !== 'finish' ? k.x : tx, k && k.t !== 'finish' ? k.y : ty, inp); return; }
  R.sim.bot(b, rv, tx, ty, inp, !!(k && k.back));
  // Pendant un arrêt (contre-courant, accostage), le pilote écope s'il a de l'eau.
  inp.bail = false;
  if (wet && b.water > 0.02 && k && (k.t === 'eddy' || k.t === 'ferry' || k.t === 'land' || k.t === 'portage') && Math.hypot(b.x - k.x, b.y - k.y) < k.r + 2 && calmHere(b)) {
    inp.bail = true; inp.fwd = inp.back = inp.left = inp.right = inp.latL = inp.latR = false;
  }
}

function events() {
  const b = boat; if (!b.ev.length) return;
  const ev = b.ev; b.ev = [];
  for (const e of ev) {
    if (e === 'bump') sfx('bump');
    else if (e === 'hit') { sfx('hit'); stats.hits++; say('Aïe, une roche! Lis la rivière plus loin devant.'); }
    else if (e === 'capsize' || e === 'swamp') {
      stats.caps++; sfx('splash');
      if (e === 'swamp') stats.wmax = 1;
      if (G.st === 'demo') { toCheckpoint(); return; }
      toSwim(); setSt('swim'); clearInp();
      say(e === 'swamp' ? 'Ton canot est plein d’eau : il ne flotte plus assez. À la nage!' : 'Tu as chaviré! Vite, la position de sécurité.');
      return;
    }
    else if (e === 'ground') { stats.grounds++; sfx('scrape'); scrapeToast(); }
    else if (e === 'scrape') scrapeToast();
    else if (e === 'travers') { if (!traversSeen && def.assist) { traversSeen = true; say('De travers sur une roche! Ton équipier gîte vers la roche : le courant passe sous la coque et le canot glisse.'); } }
    else if (e === 'cravate') { stats.crav++; sfx('hit'); lethal(e); return; } else if (e === 'ouch') { sfx('hit'); say('Aïe! En position de sécurité, tes pieds amortissent les roches.'); }
    else if (e === 'cliff') { if (!cliffSeen) { cliffSeen = true; say('Falaise : impossible de sortir ici. Continue jusqu’à une berge basse.'); } }
    else if (e === 'safe') { safe(); return; }
    else if (LET[e]) { lethal(e); return; }
  }
}

function safe() {
  if (def.swimOnly) { finish(); return; }
  if (G.st === 'demo' || G.headless) { toCheckpoint(); return; }
  setSt('dlg'); clearInp(); sfx('ding');
  R.ui.dialog('Sain et sauf!', '<p>Tu as rejoint l’eau calme. On vide le canot et on repart du dernier arrêt.</p>', [['Repartir', toCheckpoint]]);
}

function lethal(e) {
  stats.lethal++;
  if (G.st === 'demo' || G.headless) { toCheckpoint(); return; }
  sfx('fail'); setSt('dlg'); clearInp();
  R.ui.dialog(LET[e][0], '<p>' + LET[e][1] + '</p>', [[def.swimOnly ? 'Recommencer' : 'Réessayer', toCheckpoint]]);
}

function scrapeToast() { if (!scrapeSeen) { scrapeSeen = true; say('Tu racles le fond! Suis l’eau foncée : c’est la veine principale.'); } }
function waterCheck() {
  if (boat.water > stats.wmax) stats.wmax = boat.water;
  if (!waterWarned && boat.water >= 0.35) { waterWarned = true; say('Ton canot se remplit. Arrête-toi dans un contre-courant et écope.'); }
}
function pass() {
  ti++; hold = 0; portT = 0;
  if (ti < tasks.length) sfx('ding'); else finish();
}
function miss(msg, retry) {
  stats.missed++; hold = 0; say(msg);
  if (retry) { keepWater = true; toCheckpoint(); } else { ti++; if (ti >= tasks.length) finish(); }
}

function doTasks(h) {
  const k = tasks[ti], b = boat; if (!k) return;
  if (k.t === 'gate') {
    if (b.y >= k.y) { if (b.py < k.y && Math.abs(b.x - k.x) < k.w / 2) pass(); else miss('Porte manquée. On continue.', false); }
  } else if (k.t === 'finish') {
    if (b.y >= k.y) pass();
  } else if (k.t === 'portage' || k.t === 'land') {
    const land = k.t === 'land', z = k.z;
    if (!land && !z) { pass(); return; }
    const side = land ? k.side : z.side, ya = land ? k.y0 : z.y0, yb = land ? k.y1 : z.y1;
    const sp = Math.hypot(b.vx, b.vy);
    const inZ = b.y >= ya && b.y <= yb && Math.abs(b.x - bankX(side, b.y, 0)) < Math.min(8, rv.hwAt(b.y));
    if (inZ && sp < 1.3) portT += h; else portT = 0;
    hold = portT;
    if (!land) wrongSide(z, b, sp, h);
    if (portT >= 1) {
      const tip = Math.abs(b.th) > 2.094 ? 'Bel accostage, face à l’amont!' : 'Astuce : accoste face à l’amont, le canot est plus stable.';
      if (!land) {
        const y = z.toY, x = bankX(z.side, y, Math.min(5, rv.hwAt(y) * 0.4));
        boat = R.sim.newBoat(x, y, 0); cp = { x, y, th: 0 };
        say('Portage : vous portez le canot sur la berge pour contourner le seuil. ' + tip);
        pass(); snapCam();
      } else {
        cp = { x: b.x, y: b.y, th: b.th }; b.vx = b.vy = b.om = 0; say(tip);
        if (G.st === 'demo' || G.headless) pass(); else footScout(k);
      }
    } else if (land && b.y > yb + 15) miss(k.miss || 'Tu as dépassé l’endroit où accoster.', !!k.retry);
  } else {
    // Un arrêt est un arrêt : dans le cercle ET presque immobile (moins de 1,3 m/s par rapport au fond).
    // Exception : le cercle de la leçon 1 (zone), qui reste tolérant.
    const d = Math.hypot(b.x - k.x, b.y - k.y);
    if (d < k.r && (k.t === 'zone' || Math.hypot(b.vx, b.vy) < 1.3)) hold += h; else hold = Math.max(0, hold - 2 * h);
    if (hold >= k.hold) { cp = { x: k.x, y: k.y, th: b.th }; pass(); }
    else if (k.t === 'ferry' ? b.y > k.limit : b.y > k.y + k.r + 22) miss(k.miss || MISS[k.t] || MISS.zone, !!k.retry);
  }
}

// Mauvais côté : arrêté sous la falaise, en face du sentier de portage.
function wrongSide(z, b, sp, h) {
  const os = z.side === 'L' ? 'R' : 'L', sy = rv.seuil ? rv.seuil.y : z.y1 + 10;
  const on = sp < 1.3 && b.y >= z.y0 - 25 && b.y < sy && rv.bankType(os, b.y) === 'cliff' && Math.abs(b.x - bankX(os, b.y, 0)) < Math.min(8, rv.hwAt(b.y));
  if (on) wrongT += h; else { wrongT = 0; wrongShown = false; }
  if (wrongT >= 1 && !wrongShown) { wrongShown = true; say('Pas de sentier de ce côté : la falaise bloque. Traverse en bac vers l’autre rive, tant que tu as la place.'); }
}

function finish() {
  if (G.st === 'demo') { G.load(def, { demo: true }); return; }
  const s = stats;
  const n = def.swimOnly ? Math.max(1, boat.hearts)
    : (!s.caps && !s.lethal && !s.missed && !s.grounds && s.hits <= 1) ? 3 : (!s.lethal && s.caps <= 1 && s.missed <= 1) ? 2 : 1;
  G.st = 'done'; G.result = { n, niveau, stats: Object.assign({}, s) }; clearInp();
  if (G.headless) return;
  R.save.star(R.starKey(def.id, niveau), n); if (def.swimOnly) R.save.mark('swim');
  R.audio.sfx('win');
  const d = def, nv = niveau;
  setTimeout(() => { if (G.st === 'done' && def === d) R.ui.result(d, n, s, nv); }, 900);
}

function sounds(dt) {
  const paddling = boat.mode === 'canoe' && G.st === 'run' && (inp.fwd || inp.back || inp.left || inp.right);
  padT += dt; if (paddling && !boat.bailing && padT > 0.55) { padT = 0; R.audio.sfx('paddle'); }
  scrT -= dt; if (boat.mode === 'canoe' && boat.scrape > 0.15 && scrT <= 0) { scrT = 0.32; R.audio.sfx('scrape'); }
  bailT -= dt; if (boat.bailing && bailT <= 0) { bailT = 0.7; R.audio.sfx('bail'); }
  rivT += dt;
  if (rivT > 0.3) { rivT = 0; rv.flow(boat.x, boat.y, U); R.audio.setRiver(R.clamp(Math.hypot(U.x, U.y) / 3.2, 0, 1)); }
}

// ---------- Repérage ----------
function scoutStart() {
  const f = rv.features(), list = def.scout.filter(t => f.some(q => q.type === t));
  sc = { q: list, i: 0, fails: 0, y: R.clamp(boat.y + 40, 10, rv.L - 10) };
  camMode = 'scout'; setSt('scout'); scoutBar();
  if (!list.length) scoutEnd();
}
function scoutBar() {
  if (G.headless || !R.ui) return;
  R.ui.scoutbar(sc && sc.i < sc.q.length ? { q: QS[sc.q[sc.i]], i: sc.i, n: sc.q.length, foot: !!sc.foot } : null);
}
function scoutNext() { sc.i++; sc.fails = 0; tlabels = []; if (sc.i >= sc.q.length) scoutEnd(); else scoutBar(); }
// Repérage à pied (tâche « land ») : même mécanique, limité au tronçon range.
function footScout(k) {
  const ya = k.range[0], yb = k.range[1];
  const fs = rv.features().filter(f => inRange(f, [ya, yb]));
  sc = { q: (k.scout || []).filter(t => fs.some(f => f.type === t)), i: 0, fails: 0, y: (ya + yb) / 2, range: [ya, yb], foot: k };
  camMode = 'scout'; setSt('scout'); scoutBar();
  if (!sc.q.length) scoutEnd();
}
function inRange(f, r) { return (f.y1 != null ? f.y1 : f.y) >= r[0] - 5 && (f.y0 != null ? f.y0 : f.y) <= r[1] + 5; }
function scClamp(y) { return sc && sc.range ? R.clamp(y, sc.range[0], sc.range[1]) : R.clamp(y, 10, rv.L - 10); }
function fdist(f, w) {
  if (f.type === 'seuil') return [Math.abs(w.y - f.y), 5];
  if (f.type === 'falaise') { // tolérance généreuse le long de toute la paroi
    if (w.y < f.y0 - 4 || w.y > f.y1 + 4) return [Infinity, 0];
    return [Math.abs(w.x - bankX(f.side, R.clamp(w.y, f.y0, f.y1), f.side === 'L' ? -2 : 2)), 7];
  }
  return [Math.hypot(w.x - f.x, w.y - f.y), f.r];
}
// Veine principale : tout point dont la profondeur est proche du maximum de sa section.
// Haut-fond : un point peu profond sur un banc (pas le simple bord de la rive).
function depthTap(type, w) {
  const d = rv.depth(w.x, w.y);
  if (d <= -0.4) return null;
  if (type === 'veine') { const m = rv.deepest(w.y); return d >= m.d - Math.max(0.12, 0.12 * m.d) ? { x: w.x, y: w.y } : null; }
  if (d > 0.45) return null;
  for (const b of rv.bars) { const ex = (w.x - b.x) / (b.rx + 1.5), ey = (w.y - b.y) / (b.ry + 1.5); if (ex * ex + ey * ey < 1) return { x: w.x, y: w.y }; }
  return null;
}
G.depthTap = depthTap;
function scoutEnd() {
  if (R.ui) R.ui.scoutbar(null);
  const foot = sc && sc.foot; setSt('dlg');
  if (foot) {
    R.ui.dialog('Repérage terminé', '<p>Tu as vu le passage. Retourne au canot : on repart d’ici, avec ce plan en tête.</p>',
      [['Repartir', () => { sc = null; camMode = 'follow'; setSt('run'); pass(); snapCam(); }]]);
    return;
  }
  scouted = true;
  R.ui.dialog('Repérage terminé', '<p>Tu sais où passer et où t’arrêter. Garde ce plan en tête.</p>', [['Départ!', () => { camMode = 'follow'; setSt('run'); snapCam(); }]]);
}
G.scoutPan = function (d) { if (sc) sc.y = scClamp(sc.y + d); };
G.scoutSkip = function () { if (G.st === 'scout' && !G.paused) scoutNext(); };
G.scoutTap = function (sx, sy) {
  if (G.st !== 'scout' || G.paused || !sc) return;
  const type = sc.q[sc.i]; if (!type) return;
  const w = rd.toWorld(sx, sy), cands = rv.features().filter(f => f.type === type && (!sc.range || inRange(f, sc.range)));
  let best = (type === 'veine' || type === 'hautfond') ? depthTap(type, w) : null, bd = Infinity;
  if (!best) for (const f of cands) {
    if (f.type === 'veine') continue;
    const [d, lim] = fdist(f, w);
    if (d < lim && d < bd) { bd = d; best = f; }
  }
  if (best) {
    labels.push({ x: best.x, y: best.y, text: NAMES[type], kind: DANGER[type] ? 'danger' : 'ok' });
    sfx('ding'); scoutNext(); return true;
  }
  sc.fails++; sfx('no'); say('Pas tout à fait. ' + HINTS[type]);
  if (sc.fails >= 2) {
    let nb = null, nd = Infinity;
    for (const f of cands) {
      tlabels.push({ x: f.x, y: f.y, text: '?', kind: 'hint', until: G.t + 4 });
      const d = Math.hypot(w.x - f.x, w.y - f.y); if (d < nd) { nd = d; nb = f; }
    }
    if (nb) sc.y = scClamp(nb.y);
  }
  return false;
};

// ---------- Atelier du sac à corde ----------
G.ropeStart = function () {
  def = R.ROPE; rv = R.buildRiver(def); boat = null; tasks = []; ti = 0; stats = newStats();
  labels = []; tlabels = []; parts = []; clearInp(); G.paused = false; sc = null; G.result = null;
  const ty = 80;
  rope = { tx: rv.cxAt(ty) + rv.hwAt(ty) + 1.2, ty, sw: null, fly: null, n: 0, saved: 0, thrown: false, wait: 0 };
  camMode = 'rope'; setSt('rope'); ropeNext(); snapCam();
};
function ropeNext() {
  const r = rope;
  if (r.n >= 5) { ropeEnd(); return; }
  r.n++; r.sw = { x: rv.cxAt(30) - 9 + Math.random() * 14, y: 30, saved: false }; r.fly = null; r.thrown = false; r.wait = 0;
}
function ropeUpdate(dt) {
  const r = rope, s = r && r.sw; if (!s) return;
  if (s.saved) { // la corde fait pendule : le courant ramène le nageur vers la rive du lanceur
    const bx = rv.cxAt(s.y) + rv.hwAt(s.y) - 0.8;
    s.x += Math.min(1.9 * dt, Math.max(0, bx - s.x)); s.y += (r.ty + 3 - s.y) * Math.min(1, dt * 0.9);
  } else {
    // Tant que le nageur est loin en amont, hors de portée, il arrive plus vite (pas d'attente à vide).
    const k = s.y < r.ty && Math.hypot(s.x - r.tx, s.y - r.ty) > 26 ? 3 : 1;
    rv.flow(s.x, s.y, U); s.x += U.x * dt * k; s.y += U.y * dt * k;
    for (const k of rv.rocks) { const dx = s.x - k.x, dy = s.y - k.y, d = Math.hypot(dx, dy), m = k.r + 0.5; if (d < m && d > 0.01) { s.x = k.x + dx / d * m; s.y = k.y + dy / d * m; } }
  }
  if (r.fly && r.fly.p < 1) { r.fly.p += dt / r.fly.dur; if (r.fly.p >= 1) { r.fly.p = 1; ropeLand(); } }
  const out = s.y > 132 || s.x > rv.cxAt(s.y) + rv.hwAt(s.y) - 1 || s.x < rv.cxAt(s.y) - rv.hwAt(s.y) + 1;
  if (out) { r.wait += dt; if (r.wait > 0.9) ropeNext(); }
}
function ropeLand() {
  const r = rope, s = r.sw, f = r.fly;
  if (segD(s.x, s.y, r.tx, r.ty, f.x, f.y) < 2.2) {
    s.saved = true; r.saved++; sfx('ding'); say('Bien lancé! Il attrape la corde et le courant le ramène au bord.'); return;
  }
  sfx('no');
  const lt = Math.hypot(f.x - r.tx, f.y - r.ty), st = Math.hypot(s.x - r.tx, s.y - r.ty);
  if (lt < st - 2.2) say('Trop court. Lance plus loin que le nageur : la corde doit tomber sur lui.');
  else if (f.y < s.y) say('Trop tard : la corde est tombée derrière lui. Vise un peu devant, là où il sera.');
  else say('Trop tôt : vise plus près de lui.');
}
function ropeEnd() {
  const r = rope, ok = r.saved >= 3; r.sw = null; r.fly = null;
  if (ok) R.save.mark('rope');
  setSt('dlg'); sfx(ok ? 'win' : 'no');
  R.ui.dialog('Atelier terminé', '<p>Tu as sauvé <b>' + r.saved + '</b> nageur' + (r.saved > 1 ? 's' : '') + ' sur 5.</p><p>' +
    (ok ? 'Bravo! Tu sais lancer le sac à corde.' : 'Il en faut 3 pour réussir. Vise un peu devant le nageur, là où il sera.') + '</p>',
    [['Rejouer', G.ropeStart], ['Retour', () => R.ui.go('secu')]]);
}
G.ropeTap = function (sx, sy) {
  const r = rope;
  if (G.st !== 'rope' || G.paused || !r || !r.sw || r.thrown || r.sw.saved) return;
  const w = rd.toWorld(sx, sy); let dx = w.x - r.tx, dy = w.y - r.ty, d = Math.hypot(dx, dy) || 0.01;
  if (d > 22) { dx *= 22 / d; dy *= 22 / d; d = 22; }
  r.fly = { x: r.tx + dx, y: r.ty + dy, p: 0, dur: 0.45 + 0.03 * d }; r.thrown = true;
  tlabels.push({ x: r.tx, y: r.ty, text: 'Corde!', kind: 'ok', until: G.t + 1.3 }); sfx('whoosh');
};

// ---------- Pause ----------
G.canPause = () => !G.paused && ['run', 'swim', 'scout', 'rope'].includes(G.st);
G.pause = function () {
  if (!G.canPause()) return;
  G.paused = true; clearInp();
  const back = def === R.ROPE ? 'secu' : R.ui.backOf(def);
  R.ui.dialog('Pause', '<p>La rivière t’attend.</p><p>' + R.ui.soundBtn() + '</p>', [
    ['Reprendre', () => { G.paused = false; }],
    ['Recommencer', () => { G.paused = false; G.restart(); }],
    ['Quitter', () => { G.paused = false; R.ui.go(back); }]
  ], { esc: 0 });
};
G.toggleSwim = function () { if (boat && boat.mode === 'swim' && G.st === 'swim' && !G.paused) boat.active = !boat.active; };

// ---------- Outils de test ----------
// mode 'naif' : pilote naïf (mesure de difficulté) ; sinon pilote expert.
G.autoRun = function (d, max, niv, mode) {
  const was = G.headless; G.headless = true; G.naive = mode === 'naif';
  let t = 0, out;
  try {
    G.load(d, { noScout: true, niveau: niv });
    const h = 1 / 30;
    while (t < max && !G.result) { G.update(h); t += h; }
    out = { id: d.id, niveau, ok: !!G.result, t: +t.toFixed(1), ti, n: G.result ? G.result.n : 0, stats: Object.assign({}, stats) };
  } finally { G.headless = was; G.naive = false; }
  if (rd) G.demoStart();
  return out;
};

// ---------- Caméra, filets et rendu ----------
function camTarget() {

  if (camMode === 'rope') { c.s = Math.min(W / 48, H / 60); c.anchor = 0.5; return { x: rv.cxAt(80), y: 80, k: 100 }; }
  c.s = R.clamp(Math.min(W / 34, H / 46), 7, 20); c.anchor = touch ? 0.57 : 0.64; // tactile : la manette prend plus de place en bas
  const b = boat; let x = (rv.cxAt(b.y + 8) + b.x) / 2;

}

}

  const sp = Math.hypot(U.x, U.y);

  else { const ux = sp > 0.01 ? U.x / sp : 0, uy = sp > 0.01 ? U.y / sp : 1; p.px = p.x - ux * 0.16; p.py = p.y - uy * 0.16; }
}
function spawn(p) {
  const y0 = R.clamp((V.ya + V.yb) / 2, 0, rv.L); p.x = rv.cxAt(y0); p.y = y0;
  for (let i = 0; i < 8; i++) {
    const y = R.clamp(V.ya + Math.random() * (V.yb - V.ya), 0, rv.L), x = rv.cxAt(y) + (Math.random() * 2 - 1) * rv.hwAt(y) * 0.97;

}
function particles(dt) {

  const N = Math.min(520, Math.round(area * 0.085));

  if (parts.length > N) parts.length = N;
  for (const p of parts) {
    p.life -= dt;
    if (p.life <= 0 || p.y < V.ya - 2 || p.y > V.yb + 2 || p.x < V.xa - 2 || p.x > V.xb + 2) { spawn(p); continue; }

// Ce que fait chaque équipier (affiché dans la tête haute, c'est pédagogique).
// L'équipier avant avironne à gauche, l'équipier arrière à droite.
G.crewText = function (i) {
  const st = R.sim.strokes(i), bow = [], stern = [];
  if (i.fwd && !i.back) { bow.push('propulsion'); stern.push('propulsion'); }
  if (i.back && !i.fwd) { bow.push('rétro'); stern.push('rétro'); }
  if (st.fb) bow.push(st.fb < 0 ? 'appel' : 'écart');
  if (st.fs) stern.push(st.fs > 0 ? 'appel' : 'écart');
  if (!bow.length && !stern.length) return '';
  if (i.back && !i.fwd && !st.fb && !st.fs) return 'Rétro';
  const kind = st.fb && st.fs ? (Math.sign(st.fb) === Math.sign(st.fs) ? ' (déplacement latéral)' : ' (pivot)') : '';
  return 'Avant : ' + (bow.join(' et ') || 'attend') + ' · Arrière : ' + (stern.join(' et ') || 'attend') + kind;
};

G.frame = function (dt) {

}

  const ax = i => pad.axes[i] || 0;
  const cur = []; for (let i = 0; i < pad.buttons.length; i++) cur[i] = B(i);
  const prev = gpPrev, edge = i => cur[i] && !prev[i];
  gpPrev = cur;

  const up = cur[12] || ly < -DZ, dn = cur[13] || ly > DZ, lf = cur[14] || lx < -DZ, rt = cur[15] || lx > DZ;

  }

  if (G.view === 'run' && !G.paused) {
    if (boat && boat.mode === 'swim') { if (edge(0)) G.toggleSwim(); }
    else {

    const sx = Math.abs(lx) > 0.2 ? lx : (cur[15] ? 1 : 0) - (cur[14] ? 1 : 0);
    const sy = Math.abs(ly) > 0.2 ? ly : (cur[13] ? 1 : 0) - (cur[12] ? 1 : 0);

    if (edge(0)) { if (G.view === 'scout') G.scoutTap(cross.x, cross.y); else G.ropeTap(cross.x, cross.y); }
    if (G.view === 'scout') {
      const ry = ax(3), pan = (Math.abs(ry) > DZ ? -ry : 0) + (cur[5] || cur[7] ? 1 : 0) - (cur[4] || cur[6] ? 1 : 0);

// ---------- Entrées ----------
function onKey(e, down) {
  const k = (e.key || '').toLowerCase();
  if (!down) { const m = KEYS[k]; if (m) kb[m] = false; return; }
  if (R.ui && R.ui.dialogOpen()) return;
  R.audio.init();
  if ((k === 'escape' || k === 'p') && !e.repeat) { if (G.canPause()) { e.preventDefault(); G.pause(); } return; }
  if (G.st === 'scout' && !G.paused) {
    if (k === 'arrowup') { G.scoutPan(12); e.preventDefault(); } else if (k === 'arrowdown') { G.scoutPan(-12); e.preventDefault(); }
    return;
  }
  if ((G.st !== 'run' && G.st !== 'swim') || G.paused) return;
  if (k === ' ' || k === 'spacebar') { e.preventDefault(); if (!e.repeat) G.toggleSwim(); return; }
  const m = KEYS[k]; if (m) { kb[m] = true; e.preventDefault(); }
}
function setTouch() {
  if (touch) return; touch = true; document.body.classList.add('touch');
  if (G.view) G.setView(G.view);
}
function bind() {
  addEventListener('keydown', e => onKey(e, true));
  addEventListener('keyup', e => onKey(e, false));
  addEventListener('blur', clearInp);
  const first = () => R.audio.init();
  addEventListener('pointerdown', () => { first(); document.body.classList.remove('pad'); }, true);
  addEventListener('gamepadconnected', padOn);
  try { if (matchMedia('(pointer: coarse)').matches) setTouch(); } catch (x) { /* rien */ }
  addEventListener('touchstart', setTouch, { once: true, passive: true });

  cv.addEventListener('pointerdown', e => {
    if (G.st === 'scout' && !G.paused) { drag = { id: e.pointerId, x: e.clientX, y: e.clientY, y0: sc.y, moved: false }; try { cv.setPointerCapture(e.pointerId); } catch (x) { /* rien */ } }
    else if (G.st === 'rope') G.ropeTap(e.clientX, e.clientY);
  });
  cv.addEventListener('pointermove', e => {
    if (!drag || drag.id !== e.pointerId) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dy) > 8 || Math.abs(dx) > 8) drag.moved = true;
    if (drag.moved && sc) sc.y = scClamp(drag.y0 + dy / rd.cam.s);
  });
  const up = e => {
    if (!drag || drag.id !== e.pointerId) return;
    const d = drag; drag = null;
    if (!d.moved && e.type === 'pointerup') G.scoutTap(e.clientX, e.clientY);
  };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  cv.addEventListener('wheel', e => {
    if (G.st !== 'scout') return; e.preventDefault();
    G.scoutPan(-e.deltaY * (e.deltaMode === 1 ? 1.2 : 0.06));
  }, { passive: false });

  R.$$('#pad [data-k], #bailBtn').forEach(b => {
    const k = b.dataset.k;
    const on = e => {
      e.preventDefault(); R.audio.init();
      try { b.setPointerCapture(e.pointerId); } catch (x) { /* rien */ }
      if (k === 'swim') G.toggleSwim(); else kb[k] = true;
      b.classList.add('on');
    };
    const off = () => { if (k !== 'swim') kb[k] = false; b.classList.remove('on'); };
    b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off);
    b.addEventListener('pointercancel', off); b.addEventListener('lostpointercapture', off);
    b.addEventListener('contextmenu', e => e.preventDefault());
  });
}

G.init = function (canvas) {
  cv = canvas; rd = R.Renderer(canvas); rd.resize();
  addEventListener('resize', () => { rd.resize(); snapCam(); });
  bind();
  let last = performance.now();
  const loop = now => {
    requestAnimationFrame(loop);
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
    G.frame(dt);
  };
  requestAnimationFrame(loop);
};

const nivStars = (d, niv) => sv().stars[R.starKey(d.id, niv)] || 0;
// Petite échelle de niveau d'eau : une règle graduée plantée dans l'eau.
function gauge(niv) {
  const lvl = { bas: 34, moyen: 24, haut: 13 }[niv];
  let t = ''; for (let i = 0; i < 6; i++) { const y = 8 + i * 7; t += '<path d="M22 ' + y + 'h' + (i % 2 ? 4 : 7) + '"/>'; }
  return '<svg class="gauge" viewBox="0 0 44 50" aria-hidden="true"><rect class="g-w" x="0" y="' + lvl + '" width="44" height="' + (50 - lvl) + '"/>' +
    '<path class="g-wl" d="M0 ' + lvl + 'q5.5 -2.5 11 0t11 0t11 0t11 0"/><rect class="g-r" x="18" y="4" width="5" height="44" rx="1"/><g class="g-t">' + t + '</g></svg>';
}
const mmss = t => Math.floor(t / 60) + ' min ' + String(Math.floor(t % 60)).padStart(2, '0') + ' s';

function show(html, kind) {
  const s = $('#screen');
  s.className = kind === 'home' ? 'home' : 'sub';
  document.body.dataset.screen = kind === 'home' ? 'home' : 'sub';
  s.innerHTML = html; G.setView('menu'); s.scrollTop = 0; G.padFocus();
}
function menu(html, kind) { if (G.st !== 'demo') G.demoStart(); show(html, kind); }
function panel(title, body, back, kicker) {
  return '<div class="wrap"><section class="panel"><header class="ph">' +
    (back ? '<button class="back" data-go="' + back + '">' + BACK + '<span>Retour</span></button>' : '') +
    (kicker ? '<p class="kicker">' + kicker + '</p>' : '') + '<h1>' + title + '</h1></header>' + body + '</section></div>';
}

// ---------- Accueil ----------
function home() {
  const d = sv(), e = R.LEVELS.ecole, r = R.LEVELS.riv;
  const sum = l => l.reduce((a, x) => a + (d.stars[x.id] || 0), 0);
  const all1 = l => l.every(x => (d.stars[x.id] || 0) >= 1);
  const secN = SECU.filter(k => d.done[k]).length, nLex = A(R.LEX).length;
  const tile = (go, name, desc, prog, f, col) =>
    '<button class="tile" data-go="' + go + '" style="--c:' + col + '"><svg viewBox="0 0 34 32" aria-hidden="true">' + ICON[go] + '</svg>' +
    '<span class="tile-n">' + name + '</span><span class="tile-d">' + desc + '</span>' +
    '<span class="tile-p">' + prog + '</span><span class="meter"><i style="width:' + Math.round(f * 100) + '%"></i></span></button>';
  const badges = [
    ['Apprenti pagayeur', 'Toutes les leçons', all1(e), '#ffb629'],
    ['Lecteur de rivière', 'Toutes les rivières', all1(r), '#5fc6d2'],
    ['Gardien de la sécurité', 'Les 5 activités de sécurité', secN === 5, '#e8624d'],
    ['Savant de la rivière', 'Le quiz réussi', !!d.done.quiz, '#8fd18a']
  ];
  // Pagayeur toutes eaux : au moins 1 étoile sur chaque rivière aux trois niveaux. Pas requis pour le brevet.
  const brevet = badges.every(b => b[2]);
  badges.push(['Pagayeur toutes eaux', 'Chaque rivière aux trois niveaux d’eau', r.every(x => NIVS.every(n => (d.stars[R.starKey(x.id, n)] || 0) >= 1)), '#4aa3df']);
  badges.push(['Brevet Riv101', 'Tout le parcours', brevet, '#eefaf7']);
  const bh = badges.map(b => '<li class="badge' + (b[2] ? ' on' : '') + '" style="--c:' + b[3] + '"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 3l15 5v11c0 9-6.5 15-15 18C11.5 34 5 28 5 19V8z"/><path class="w" d="M11 21c3-3 6 3 9 0s6 3 9 0"/></svg><span><b>' + b[0] + '</b><small>' + (b[2] ? 'Obtenu' : b[1]) + '</small></span></li>').join('');
  menu('<div class="home-col">' +
    '<p class="kicker">École d’eau vive</p><h1 class="logo">Riv<span>101</span></h1>' +
    '<p class="lead">Apprends les coups d’aviron, lis les rapides comme une carte et garde la tête froide quand l’eau devient blanche.</p>' +
    '<div class="tiles">' +
    tile('ecole', 'École de canot', 'Avancer, tourner, le bac, les arrêts et la gîte.', sum(e) + ' / ' + e.length * 3 + ' étoiles', sum(e) / (e.length * 3), '#ffb629') +
    tile('riv', 'Rivières', 'Sept descentes, du ruisseau à la grande rivière.', sum(r) + ' / ' + r.length * 3 + ' étoiles', sum(r) / (r.length * 3), '#5fc6d2') +
    tile('secu', 'Sécurité', 'Équipement, signaux, sac à corde et nage.', secN + ' / 5 activités', secN / 5, '#e8624d') +
    tile('lex', 'Lexique et quiz', 'Les mots de la rivière, en images.', d.done.quiz ? 'Quiz réussi' : nLex + ' mots, quiz à faire', d.done.quiz ? 1 : 0, '#8fd18a') +
    '</div><section class="badges"><h2>Écussons</h2><ul>' + bh + '</ul></section>' +
    '<div class="opts">' + soundBtn() +
    '<label><input type="checkbox" id="optUnlock"' + (d.opts.unlock ? ' checked' : '') + '> Tout débloquer (parents)</label></div></div>', 'home');
}

// ---------- Listes de niveaux ----------
function list(key) {
  const L = R.LEVELS[key], d = sv();
  const cards = L.map(x => {
    const open = isOpen(x);
    const res = !open ? '<span class="lock">' + LOCK + 'Verrouillé</span>'
      : key !== 'riv' ? stars(d.stars[x.id] || 0)
      : '<span class="nivs">' + NIVS.map(n => '<span class="niv-r"><span class="niv-n">' + { bas: 'Bas', moyen: 'Moyen', haut: 'Haut' }[n] + '</span>' +
        (nivOpen(x, n) ? stars(nivStars(x, n)) : '<span class="lock sm">' + LOCK + '</span>') + '</span>').join('') + '</span>';
    return '<button class="card' + (open ? '' : ' locked') + '"' + (open ? ' data-go="brief:' + x.id + '"' : ' disabled') + '>' +
      '<span class="cls">' + esc(x.cls) + '</span><span class="cn">' + esc(x.name) + '</span>' + res + '</button>';
  }).join('');
  const note = key === 'riv' && !isOpen(L[0]) ? '<p class="note">Réussis la leçon 2 de l’École de canot pour ouvrir la première rivière.</p>' : '';
  menu(panel(key === 'ecole' ? 'École de canot' : 'Rivières',
    '<p class="lead">' + (key === 'ecole' ? 'Chaque leçon ouvre la suivante. Une étoile suffit pour avancer.' : 'Repère, choisis ta ligne, puis descends. Chaque rivière réussie ouvre la suivante.') + '</p>' +
    note + '<div class="cards">' + cards + '</div>', 'home'), 'sub');
}

// ---------- Breffage ----------
function keysHtml(x) {
  if (x.swimOnly) return '<h2>Commandes</h2><ul class="keys"><li><kbd>Espace</kbd> Position de sécurité ou nage active</li><li><kbd>←</kbd> <kbd>→</kbd> <kbd>↑</kbd> <kbd>↓</kbd> Nager</li><li><kbd>Échap</kbd> Pause</li></ul><p class="small mute">Manette : stick gauche ou croix pour nager, A pour la posture, Start pour la pause.</p>';
  return '<h2>Commandes</h2><ul class="keys"><li><kbd>↑</kbd> Propulsion</li><li><kbd>↓</kbd> Rétro</li><li><kbd>←</kbd> <kbd>→</kbd> Pivot à gauche, à droite</li><li><kbd>Q</kbd> <kbd>E</kbd> Déplacement latéral à gauche, à droite</li>' +
    (x.assist ? '<li class="mute">Ici, la gîte se fait toute seule.</li>' : '<li><kbd>A</kbd> <kbd>D</kbd> Gîte à gauche, à droite</li>') +
    (isRiv(x) ? '<li><kbd>B</kbd> Écoper (à l’arrêt, en eau calme)</li>' : '') +
    '<li><kbd>Échap</kbd> Pause</li></ul>' +
    '<p class="small mute">Pivot : les deux équipiers font un appel (ou un écart). Déplacement latéral : l’un fait un appel, l’autre un écart, et le canot glisse de côté sans tourner.</p>' +
    '<p class="small mute">Manette : stick gauche ou croix pour pagayer, LB et RB (ou stick droit) pour le déplacement latéral, LT et RT pour gîter, ' + (isRiv(x) ? 'X pour écoper, ' : '') + 'Start pour la pause.' + (x.scout ? ' Au repérage : réticule au stick gauche, A pour toucher, stick droit pour longer la rivière, X pour passer.' : '') + '</p>' +
    (x.scout ? '<p class="small mute">Au repérage : glisse pour longer la rivière, puis touche ce qu’on te demande.</p>' : '') +
    '<p class="small mute">Sur tablette, utilise les boutons à l’écran' + (isRiv(x) ? ' ; le bouton Écoper apparaît quand il y a de l’eau dans le canot' : '') + '. L’aval est en haut de l’écran.</p>';
}
let nivSel = 'moyen';
function nivPicker(x) {
  if (!isRiv(x)) return '';
  if (!nivOpen(x, nivSel)) nivSel = 'moyen';
  return '<h2>Niveau d’eau</h2><div class="nivpick" role="radiogroup" aria-label="Niveau d’eau">' + NIVS.map(n => {
    const ok = nivOpen(x, n);
    return '<button type="button" class="nivb" role="radio" aria-checked="' + (n === nivSel) + '" data-niv="' + n + '"' + (ok ? '' : ' disabled') + '>' + gauge(n) +
      '<span class="nivb-n">' + NIV_NOM[n] + '</span><span class="nivb-c">' + esc(R.clsFor(x, n)) + '</span>' +
      (ok ? stars(nivStars(x, n)) : '<span class="lock sm">' + LOCK + '1 étoile en eau moyenne</span>') + '</button>';
  }).join('') + '</div><p class="nivtxt">' + NIV_TXT[nivSel] + '</p>';
}
function brief(x, niv) {
  if (!x) return home();
  if (!isOpen(x)) return list(listOf(x));
  if (niv) nivSel = niv;
  const lex = A(R.LEX), terms = A(x.terms).map(id => lex.find(t => t.id === id)).filter(Boolean);
  const words = terms.length ? '<h2>Mots à retenir</h2><dl class="words">' + terms.map(t => '<div><dt>' + esc(t.t) + '</dt><dd>' + esc(t.d) + '</dd></div>').join('') + '</dl>' : '';
  const nv = isRiv(x) ? nivSel : 'moyen', picker = nivPicker(x);
  menu(panel(esc(x.name), A(x.intro).map(p => '<p class="intro">' + esc(p) + '</p>').join('') + picker + words + keysHtml(x) +
    '<div class="actions"><button class="btn" data-go="play:' + x.id + (isRiv(x) ? '@' + nivSel : '') + '">' + (x.scout ? 'Repérage' : 'Départ') + '</button>' +
    '<button class="btn ghost" data-go="' + listOf(x) + '">Retour</button></div>', listOf(x), esc(R.clsFor(x, nv)) + (nv !== 'moyen' ? ' · ' + NIV_NOM[nv].toLowerCase() : '')), 'sub');
}
function play(x, niv) {
  if (!x) return home();
  if (niv && !nivOpen(x, niv)) niv = 'moyen';
  R.audio.init(); G.load(x, { niveau: niv });
}

// ---------- Résultat ----------
function tip(s, x) {
  if (x.swimOnly) return s.lethal ? 'Reste sur le dos, pieds vers l’aval, et éloigne-toi tôt des arbres tombés.' : 'Près des roches, reste en position de sécurité. La nage active, c’est seulement en eau libre.';
  if (s.lethal) return 'Les pires dangers se voient au repérage : passoires, rouleaux, seuils. Repère-les et éloigne-toi tôt.';
  if (s.caps) return 'Pour rester sur l’eau : gîte vers l’aval du courant où tu entres, donc vers l’intérieur de ton virage.';
  if (s.missed) return 'Prépare chaque manœuvre plus tôt : un bon angle vaut mieux que de la vitesse.';
  if (s.grounds) return 'Suis l’eau foncée : c’est la veine principale. L’eau pâle cache des hauts-fonds où le canot racle.';
  if (s.wmax > 0.5) return 'Dans les vagues, ralentis avec un rétro et garde le canot droit. Écope à l’arrêt, en eau calme.';
  if (s.hits > 1) return 'Regarde loin devant et choisis ta ligne avant d’arriver aux roches.';
  return 'Descente parfaite. Tu peux passer à la suite!';
}
U.result = function (x, n, s, niv) {
  niv = niv || 'moyen';
  const key = listOf(x), L = R.LEVELS[key], i = L ? L.indexOf(x) : -1, nx = L && i >= 0 ? L[i + 1] : null;
  const rows = x.swimOnly
    ? [['Temps', mmss(s.time)], ['Cœurs restants', n], ['Recommencements', s.lethal]]
    : [['Temps', mmss(s.time)], ['Roches touchées', s.hits], ['Chavirages', s.caps], ['Objectifs manqués', s.missed]]
      .concat(isRiv(x) ? [['Échouages', s.grounds || 0], ['Eau embarquée max', Math.round((s.wmax || 0) * 100) + ' %']] : []);
  show(panel(n >= 3 ? 'Superbe!' : n === 2 ? 'Bien joué!' : 'Arrivée!',
    '<div class="res-stars">' + stars(n, true) + '</div>' +
    '<dl class="stats">' + rows.map(r => '<div><dt>' + r[0] + '</dt><dd>' + r[1] + '</dd></div>').join('') + '</dl>' +
    (x.learned ? '<p class="learned"><b>Tu as appris :</b> ' + esc(x.learned) + '</p>' : '') +
    '<p class="tip">' + tip(s, x) + '</p><div class="actions">' +
    (nx ? '<button class="btn" data-go="brief:' + nx.id + '">Suivant</button>' : '') +
    '<button class="btn' + (nx ? ' ghost' : '') + '" data-go="play:' + x.id + (isRiv(x) ? '@' + niv : '') + '">Rejouer</button>' +
    '<button class="btn ghost" data-go="' + key + '">Menu</button></div>', null, esc(x.name) + (isRiv(x) && niv !== 'moyen' ? ' · ' + NIV_NOM[niv].toLowerCase() : '')), 'sub');
};

}
function ropeBrief() {

    '<ol class="steps"><li><b>Crie « Corde! »</b> pour qu’il te regarde.</li><li><b>Lance pour que la corde tombe sur lui</b>, un peu devant, là où il sera.</li><li><b>Tiens-toi solidement</b>, assis ou derrière un appui. Ne t’attache jamais à la corde.</li></ol>' +
    '<p class="small mute">Touche ou clique sur l’eau pour lancer. Avec la manette : réticule au stick gauche, A pour lancer. Un seul lancer par nageur. Il en faut 3 sur 5.</p>' +

// Équipement
let eq = null;
function equip() {
  const items = R.shuffle(A(R.EQUIP));
  eq = { items };
  if (!items.length) return menu(panel('Prépare ton équipement', '<p>Le contenu arrive bientôt.</p>', 'secu'), 'sub');
  menu(panel('Prépare ton équipement', '<p class="lead">Touche ce que tu mets dans ton sac ou sur toi pour la sortie. Laisse le reste à la maison.</p>' +
    '<div class="picks">' + items.map((it, i) => '<button class="pick" aria-pressed="false" data-pick="' + i + '">' + esc(it.n) + '</button>').join('') + '</div>' +
    '<div class="actions"><button class="btn" data-act="eqcheck">Vérifier</button><button class="btn ghost" data-go="secu">Retour</button></div>' +
    '<div id="fb" class="fb" aria-live="polite"></div>', 'secu', 'Sécurité'), 'sub');
}
function eqCheck() {
  const errs = [];
  $$('.pick').forEach(b => {
    const it = eq.items[+b.dataset.pick], on = b.getAttribute('aria-pressed') === 'true';
    if (on !== !!it.ok) errs.push((it.ok ? '<b>Il te manque : ' : '<b>À laisser : ') + esc(it.n) + '.</b> ' + esc(it.why));
  });
  const fb = $('#fb');
  if (!errs.length) {
    R.save.mark('equip'); R.audio.sfx('win');
    fb.innerHTML = '<p class="verdict ok">Parfait! Ton sac est prêt.</p><p>Avant chaque sortie, on vérifie : veste de flottaison bien attachée, casque, sifflet et un adulte formé.</p><div class="actions"><button class="btn" data-go="secu">Retour à la sécurité</button></div>';
  } else {
    R.audio.sfx('no');
    fb.innerHTML = '<p class="verdict ko">' + errs.length + ' erreur' + (errs.length > 1 ? 's' : '') + '. Corrige et vérifie encore.</p><ul class="errs">' + errs.map(e => '<li>' + e + '</li>').join('') + '</ul>';
  }
  fb.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
